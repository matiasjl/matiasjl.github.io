<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EVISV Indexación de videos</title>

  <!-- Isotope (única librería) -->
  <script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>

  <style>
    :root{
      --bg:#0f1115; --fg:#e7e7ea; --muted:#a8acb8; --brand:#4ea1ff; --chip:#232635;
      --card:#171923; --radius:12px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Roboto,Segoe UI,Helvetica,Arial}
    header,footer{padding:18px 20px;background:#12141b;border-bottom:1px solid #1d2130}
    footer{border-top:1px solid #1d2130;border-bottom:none;opacity:.9}
    .wrap{max-width:1100px;margin:0 auto}
    .brand{display:flex;align-items:center;gap:10px}
    .brand h1{margin:0;font-size:18px;font-weight:700}
    .brand small{color:var(--muted)}
    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .chip{border:1px solid #2a2f45;background:var(--chip);color:#c9cbe0;padding:6px 10px;border-radius:999px;cursor:pointer}
    .chip.is-active{background:var(--brand);color:#0c1220;border-color:transparent}
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
    .search{padding:8px 10px;border-radius:10px;border:1px solid #2a2f45;background:#111421;color:var(--fg);min-width:220px}
    .reset{background:transparent;border:1px solid #2a2f45;color:#c9cbe0;padding:8px 10px;border-radius:10px;cursor:pointer}
    .reset:hover{border-color:var(--brand);color:var(--brand)}
    /* Grid */
    .grid{margin:18px 0}
    .grid-sizer,.grid-item{width: 100%;}
    @media (min-width:560px){ .grid-sizer,.grid-item{width:50%;} }
    @media (min-width:880px){ .grid-sizer,.grid-item{width:33.3333%;} }
    .card{
      background:var(--card); border:1px solid #23263a; border-radius:var(--radius);
      overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,.25); transform:translateZ(0);
    }
    .thumb {
    position: relative;
    aspect-ratio: 16/9;
    background: #0b0e17;
    overflow: hidden;
    }
    .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    }
    .meta{padding:12px}
    .title{font-weight:600;margin:0 0 6px 0;font-size:15px}
    .tags{display:flex;flex-wrap:wrap;gap:6px}
    .tag{font-size:12px;color:#b7bbcc;background:#1e2233;border:1px solid #2a2f45;border-radius:999px;padding:2px 8px}
    .footer-note{color:var(--muted);font-size:13px}
    a, a:visited{color:#9cc8ff;text-decoration:none}
    a:hover{text-decoration:underline}
    .placeholder {
      display:flex;align-items:center;justify-content:center;color:#98a0b3;font-size:13px;background:#0e1116;height:100%;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <h1>Entornos Virtuales e Introducción a la Simulación y los Videojuegos</h1>
        <small>FdA UNLP 2025</small>
      </div>

      <div class="controls">
        <input id="search" class="search" placeholder="Buscar por título…" aria-label="Buscar" />
        <button id="reset" class="reset">Limpiar filtros</button>
      </div>
      <div id="filter-chips" class="filters" aria-label="Filtros por etiquetas"></div>
    </div>
  </header>

  <main class="wrap">
    <div id="grid" class="grid">
      <div class="grid-sizer"></div>
    </div>
  </main>

  <footer>
    <div class="wrap footer-note">
      <strong>Indexación del canal de youtube:</strong> <a href="https://www.youtube.com/@tecnologiamultimedial2cate353">Tecnologia Multimedial 2 Cátedra Causa</a>
    </div>
  </footer>

  <!-- Fallback JSON si no hay servidor -->
  <script id="videos-fallback" type="application/json">
  {
    "videos": [
      { "id": "Ks-_Mh1QhMc", "title": "Demo · Motion & Color", "tags": ["demo","motion","color"] },
      { "id": "https://youtu.be/aqz-KE-bpKQ", "title": "Trailer · Big Buck Bunny", "tags": ["trailer","animación","open-source"] },
      { "id": "dQw4w9WgXcQ", "title": "Classic Pop · 80s", "tags": ["music","pop","80s"] },
      { "id": "https://www.youtube.com/watch?v=ysz5S6PUM-U", "title": "YouTube API · Sample", "tags": ["demo","api","youtube"] }
    ]
  }
  </script>

  <script>
    // helpers
    const $ = (s,ctx=document)=>ctx.querySelector(s);
    const $$ = (s,ctx=document)=>[...ctx.querySelectorAll(s)];

    const state = { activeTags: new Set(), searchText: "" };
    let iso = null;

    // Extrae ID YouTube de varios formatos (ID puro, youtu.be, watch?v=, embed/)
    function extractYouTubeID(input){
      if(!input) return null;
      const s = String(input).trim();
      // ID puro 11 chars
      const pure = s.match(/^([A-Za-z0-9_-]{11})$/);
      if(pure) return pure[1];
      // common url patterns
      const re = [
        /(?:youtube\.com\/.*v=|youtube\.com\/v\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/,
        /youtu\.be\/([A-Za-z0-9_-]{11})/,
        /vi\/([A-Za-z0-9_-]{11})/,
        /v=([A-Za-z0-9_-]{11})/
      ];
      for(const r of re){
        const m = s.match(r);
        if(m && m[1]) return m[1];
      }
      // fallback: pick first 11-char token if present
      const any = s.match(/([A-Za-z0-9_-]{11})/);
      return any ? any[1] : null;
    }

    // URLs de thumbnail (primaria y fallback)
    function thumbUrlsFromId(id){
      if(!id) return [];
      return [
        `https://i.ytimg.com/vi/${id}/hqdefault.jpg`,
        `https://img.youtube.com/vi/${id}/hqdefault.jpg`,
        `https://i.ytimg.com/vi/${id}/mqdefault.jpg`
      ];
    }
    function watchUrlFromId(id){
      return id ? `https://www.youtube.com/watch?v=${id}` : '#';
    }

    // placeholder SVG tiny (inline) — se usa cuando las miniaturas fallan
    const placeholderSVG = `data:image/svg+xml;utf8,${encodeURIComponent(`
      <svg xmlns='http://www.w3.org/2000/svg' width='800' height='450'>
        <rect width='100%' height='100%' fill='#0b0e17'/>
        <text x='50%' y='50%' fill='#6f7586' font-size='20' font-family='Arial' text-anchor='middle' dominant-baseline='middle'>No thumbnail</text>
      </svg>
    `)}`;

    // render grid items
    function renderGrid(data){
      const grid = $("#grid");
      grid.innerHTML = '<div class="grid-sizer"></div>' + data.videos.map(v=>{
        const rawTags = Array.isArray(v.tags) ? v.tags.map(t=>String(t).trim()).filter(Boolean) : [];
        const dataTags = rawTags.join(",");
        const safeTitle = (v.title||'').toString().trim().replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const rawId = v.id || v.url || v.video || '';
        const ytId = extractYouTubeID(rawId);
        const thumbUrls = ytId ? thumbUrlsFromId(ytId) : [];
        const firstThumb = thumbUrls[0] || placeholderSVG;
        const watch = watchUrlFromId(ytId);

        // data attributes: tags lowercased
        const dataTagsAttr = dataTags.toLowerCase();

        return `
            <div class="grid-item" data-tags="${dataTagsAttr}" data-title="${safeTitle.toLowerCase()}">
                <article class="card">
                <a class="thumb" href="${watch}" target="_blank" rel="noopener">
                    <img loading="lazy"
                        src="${firstThumb}"
                        alt="${safeTitle}"
                        referrerpolicy="no-referrer"
                        data-thumb-urls='${JSON.stringify(thumbUrls)}' />
                </a>
                <div class="meta">
                    <h3 class="title">
                    <a href="${watch}" target="_blank" rel="noopener">${safeTitle}</a>
                    </h3>
                    <div class="tags">${rawTags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
                </div>
                </article>
            </div>
        `;
      }).join('');

      // init / reload isotope
      if(!iso){
        iso = new Isotope(grid, {
          itemSelector: '.grid-item',
          percentPosition: true,
          masonry: { columnWidth: '.grid-sizer', gutter: 12 },
          filter: itemElem => {
            const itemTags = (itemElem.getAttribute('data-tags')||'').split(',').filter(Boolean);
            const itemTitle = itemElem.getAttribute('data-title') || '';
            const matchesText = !state.searchText || itemTitle.includes(state.searchText);
            const matchesTags = state.activeTags.size === 0 ||
                                [...state.activeTags].every(t => itemTags.includes(t));
            return matchesText && matchesTags;
          }
        });
      } else {
        iso.reloadItems();
        iso.arrange();
      }

      // wait for images, attempt fallbacks if an image errors
      const imgs = $$('#grid img');
      imgs.forEach(img=>{
        // if image fails, try alternative thumb urls, then placeholder
        img.addEventListener('error', function onErr(){
          const urls = JSON.parse(this.getAttribute('data-thumb-urls') || '[]');
          // remove current src from list (if present)
          const current = this.src || '';
          const next = urls.find(u=>u && u !== current);
          if(next){
            // remove used url so we don't loop
            const remaining = urls.filter(u=>u!==next);
            this.setAttribute('data-thumb-urls', JSON.stringify(remaining));
            this.removeEventListener('error', onErr);
            // try next url
            this.src = next;
            // reattach error handler for next attempt
            this.addEventListener('error', onErr);
            return;
          }
          // no more fallbacks
          console.warn('Thumbnail failed for', this.alt, '-> using placeholder');
          this.src = placeholderSVG;
          this.removeEventListener('error', onErr);
        }, {once:false});
      });

      // after all images settled (loaded or error) layout
      const wait = imgs.map(img => new Promise(res=>{
        if(img.complete && img.naturalWidth!==0) return res();
        // some may error and still be "complete" with naturalWidth 0
        img.addEventListener('load', ()=>res(), {once:true});
        img.addEventListener('error', ()=>res(), {once:true});
      }));
      Promise.all(wait).then(()=> {
        iso.layout();
      });
    }

    function renderChips(data){
      const set = new Set();
      data.videos.forEach(v => (v.tags||[]).forEach(t => set.add(String(t).toLowerCase())));
      const sorted = [...set].sort((a,b)=>a.localeCompare(b,'es'));
      const box = $("#filter-chips");
      box.innerHTML = sorted.map(t=>`<button class="chip" data-tag="${t}">#${t}</button>`).join("");
      box.addEventListener('click', e=>{
        const btn = e.target.closest('.chip');
        if(!btn) return;
        const tag = btn.getAttribute('data-tag');
        if (state.activeTags.has(tag)) {
          state.activeTags.delete(tag);
          btn.classList.remove('is-active');
        } else {
          state.activeTags.add(tag);
          btn.classList.add('is-active');
        }
        iso.arrange();
      });
    }

    $("#search").addEventListener('input', e=>{
      state.searchText = (e.target.value || '').trim().toLowerCase();
      if(iso) iso.arrange();
    });

    $("#reset").addEventListener('click', ()=>{
      state.activeTags.clear();
      state.searchText = "";
      $("#search").value = "";
      $$("#filter-chips .chip").forEach(c=>c.classList.remove('is-active'));
      if(iso) iso.arrange();
    });

    (async function bootstrap(){
      let data = null;
      try {
        const resp = await fetch('videos.json',{cache:'no-store'});
        if(!resp.ok) throw new Error('No JSON');
        data = await resp.json();
      } catch(e){
        const raw = $("#videos-fallback")?.textContent?.trim();
        if(raw){
          try { data = JSON.parse(raw); } catch(err) { data = { videos: [] }; }
        } else data = { videos: [] };
      }
      if(!data || !Array.isArray(data.videos)) data = { videos: [] };
      renderGrid(data);
      renderChips(data);
      // debug: if thumbnails missing often, open console and search for "Thumbnail failed"
      console.log('Mosaico listo — items:', (data.videos||[]).length);
    })();
  </script>
</body>
</html>
